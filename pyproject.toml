[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "his-monitoring"
version = "0.1.1"
description = "Logging, metrics, resource monitoring, and webhook alert helpers for Python services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prometheus-client>=0.23.1",
    "psutil>=7.1.3",
    "requests>=2.32.5",
]

[project.optional-dependencies]
loki = [
    "python-logging-loki>=0.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "."}
packages = ["his_mon"]
